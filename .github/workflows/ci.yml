name: CI

on:
  # Branch pushes are covered by their PR; running on both doubled every check.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory_engine
          POSTGRES_PASSWORD: memory_engine
          POSTGRES_DB: memory_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://memory_engine_app:memory_engine_app@localhost:5432/memory_engine
      ADMIN_DATABASE_URL: postgresql+psycopg://memory_engine:memory_engine@localhost:5432/memory_engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run migrations
        run: alembic upgrade head

      - name: Test
        run: pytest

      - name: Start API
        run: |
          nohup uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "API did not come up"; cat uvicorn.log; exit 1

      # Fails the run on any cross-tenant leak or supersede failure. Recall/MRR are
      # reported but don't gate until search lands (milestone 4 adds --require-retrieval).
      - name: Eval
        run: |
          set +e
          python -m eval.harness --base-url http://localhost:8000 > eval-report.txt
          status=$?
          cat eval-report.txt
          { echo '```'; cat eval-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: API log
        if: failure()
        run: cat uvicorn.log || true
