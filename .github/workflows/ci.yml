name: CI

on:
  # Branch pushes are covered by their PR; running on both doubled every check.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mutable
          POSTGRES_PASSWORD: mutable
          POSTGRES_DB: mutable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mutable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://mutable_app:mutable_app@localhost:5432/mutable
      ADMIN_DATABASE_URL: postgresql+psycopg://mutable:mutable@localhost:5432/mutable
      # Where fastembed keeps the embedding model; the cache step below saves this folder.
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The embedding model is downloaded once and then restored from the cache on later
      # runs. The key changes whenever app/embeddings.py does, which is where the model is named.
      - name: Restore the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-${{ hashFiles('app/embeddings.py') }}

      # Loads the model, downloading it only if the cache didn't have it. The test and API
      # steps set HF_HUB_OFFLINE, so there a missing model fails loudly instead of downloading.
      - name: Download the embedding model
        run: python -c "from app.embeddings import LocalEmbedder; LocalEmbedder()"

      - name: Run migrations
        run: alembic upgrade head

      - name: Test
        run: pytest
        env:
          HF_HUB_OFFLINE: "1"

      - name: Start API
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          nohup uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "API did not come up"; cat uvicorn.log; exit 1

      # Fails the run on any cross-tenant leak or supersede failure. Recall/MRR are
      # reported but don't gate until search lands (milestone 4 adds --require-retrieval).
      - name: Eval
        run: |
          set +e
          python -m eval.run_eval --base-url http://localhost:8000 > eval-report.txt
          status=$?
          cat eval-report.txt
          { echo '```'; cat eval-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: API log
        if: failure()
        run: cat uvicorn.log || true
