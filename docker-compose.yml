services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mutable
      POSTGRES_PASSWORD: mutable
      POSTGRES_DB: mutable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutable"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://mutable_app:mutable_app@db:5432/mutable
      ADMIN_DATABASE_URL: postgresql+psycopg://mutable:mutable@db:5432/mutable
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
