services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory_engine
      POSTGRES_PASSWORD: memory_engine
      POSTGRES_DB: memory_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://memory_engine:memory_engine@db:5432/memory_engine
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
