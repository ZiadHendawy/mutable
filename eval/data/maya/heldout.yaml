# Held-out questions for Maya: same format and rules as questions.yaml, but never used for
# tuning. run_eval.py scores them separately and reports totals only -- no per-question
# diffs -- so search can't be fitted to them. Their job is to show the main set's scores
# weren't reached by overfitting those 75 questions.
#
# Written before any search code existed. Same category mix as the main set, scaled to 20.
# Nine target records the main set never asks about; the rest reach known records from a
# new angle. Ids are h-numbered; append, don't renumber.

# --- Preference evolution: current (older versions must not surface) -------------------
# No "now" or "still" in the wording: current has to be the default, not a keyword match.

- id: h001
  question: I'm making salmon for dinner -- will Maya eat it?
  category: preference_current
  expected: [maya.pref.diet.v2]
  must_exclude: [maya.pref.diet.v1]

- id: h002
  question: Would Maya take a hybrid job that's three days a week in the office?
  category: preference_current
  expected: [maya.pref.work_location.v2]
  must_exclude: [maya.pref.work_location.v1]

- id: h003
  question: Should I get Maya a Kindle or a hardcover for her birthday?
  category: preference_current
  expected: [maya.pref.reading.v2]
  must_exclude: [maya.pref.reading.v1]

# --- Preference evolution: historical (an older version must still be found) ------------

- id: h004
  question: What design software was Maya using in 2018?
  category: preference_historical
  expected: [maya.pref.design_tool.v1]
  must_exclude: [maya.pref.design_tool.v2]
  as_of: 2018-06-01

- id: h005
  question: How did Maya like to travel in 2021?
  category: preference_historical
  expected: [maya.pref.travel_style.v1]
  must_exclude: [maya.pref.travel_style.v2]
  as_of: 2021-06-01

- id: h006
  question: How have Maya's coffee and tea habits changed over the years?
  category: preference_historical
  expected: [maya.pref.caffeine.v1, maya.pref.caffeine.v2, maya.pref.caffeine.v3]

